<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Style Heaven POS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Style Heaven</div>
      <button id="btn-login" class="btn small">Login</button>
    </header>

    <main class="container">
      <div id="logged-out" class="center-box">
        <h2>Welcome to Style Heaven POS</h2>
        <p>Please login to continue</p>
        <button id="openLogin" class="btn primary">Login</button>
      </div>

      <div id="pos-app" class="hidden">
        <section class="left">
          <div class="search-row">
            <input id="search" placeholder="Search product or category..." />
            <select id="categoryFilter">
              <option value="all">All categories</option>
            </select>
          </div>

          <div id="product-grid" class="grid"></div>
        </section>

        <section class="right">
          <div class="receipt">
            <h3>Receipt</h3>
            <div id="itemsList" class="items"></div>

            <div class="totals">
              <div><span>Tax:</span><span id="tax">৳0.00</span></div>
              <div><span>Total:</span><span id="total">৳0.00</span></div>
              <div><span>Paid:</span><span id="paid">৳0.00</span></div>
              <div><span>Due:</span><span id="due">৳0.00</span></div>
            </div>

            <div class="controls">
              <button id="payBtn" class="btn primary">Pay</button>
              <button id="clearBtn" class="btn">Clear</button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h3>Login</h3>
      <label>Username</label>
      <input id="username" placeholder="Username" />
      <label>Password</label>
      <input id="password" type="password" placeholder="Password" />
      <div class="modal-actions">
        <button id="loginSubmit" class="btn primary">Sign in</button>
        <button id="closeModal" class="btn">Cancel</button>
      </div>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

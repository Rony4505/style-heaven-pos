<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }
    p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header>Style Heaven</header>
  <main>
    <h1>Welcome to Style Heaven POS</h1>
    <p>Please log in to continue</p>
    <button id="login">Login</button>
  </main>

  <script>
    document.getElementById("login").addEventListener("click", () => {
      // Future: redirect to actual login page or app screen
      window.location.href = "/login"; 
    });
  </script>
</body>
</html>

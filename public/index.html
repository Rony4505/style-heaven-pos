<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
      position: relative;
    }
    #logout {
      position: absolute;
      right: 15px;
      top: 10px;
      background-color: crimson;
      border: none;
      color: white;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    #logout:hover {
      background-color: darkred;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS
    <button id="logout">Logout</button>
  </header>
  <main>
    <h1>Welcome, Rony!</h1>
    <p>This is your main POS dashboard.</p>
  </main>

  <script>
    // check login status
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "/index.html";
    }

    // logout
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("loggedIn");
      window.location.href = "/index.html";
    });
  </script>
</body>
</html>

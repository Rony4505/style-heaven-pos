<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Style Heaven POS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">Style Heaven</div>
      <button id="btn-login" class="btn small">Login</button>
    </header>

    <!-- Main Container -->
    <main class="container">

      <!-- Logged-out view -->
      <div id="logged-out" class="center-box">
        <h2>Welcome to Style Heaven POS</h2>
        <p>Please login to continue</p>
        <button id="openLogin" class="btn">Login</button>
      </div>

      <!-- Login Box -->
      <div id="loginBox" class="hidden login-box">
        <h2>Login</h2>
        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />
        <p id="loginError" class="error"></p>
        <div class="button-row">
          <button id="loginBtn" class="btn">Sign in</button>
          <button id="cancelLogin" class="btn secondary">Cancel</button>
        </div>
      </div>

      <!-- Main App -->
      <div id="main-app" class="hidden">
        <h2>Product List</h2>
        <div id="product-list" class="product-list"></div>
      </div>

    </main>
  </div>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>

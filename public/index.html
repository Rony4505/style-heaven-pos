<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      width: 100%;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      font-weight: 600;
      font-size: 18px;
    }
    .login-box {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 30px;
      width: 320px;
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .show-password {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .show-password input {
      width: auto;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <header>Style Heaven</header>

  <div class="login-box">
    <h2>Login to Style Heaven POS</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <div class="show-password">
      <input type="checkbox" id="showPass" />
      <label for="showPass">Show Password</label>
    </div>
    <button id="loginBtn">Login</button>

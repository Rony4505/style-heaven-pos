<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #fafafa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    main {
      margin-top: 100px;
      text-align: center;
    }

    button {
      display: block;
      width: 200px;
      margin: 10px auto;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #logout {
      background-color: #ff3b30;
    }

    #logout:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS</header>
  <main>
    <h2>🛍️ Welcome, Rony!</h2>
    <button id="newSaleBtn">🛒 New Sale</button>
    <button id="productsBtn">📦 Products</button>
    <button id="historyBtn">💰 Sales History</button>
    <button id="settingsBtn">⚙️ Settings</button>
    <button id="logout">🚪 Log Out</button>
  </main>

  <script>
    document.getElementById("newSaleBtn").addEventListener("click", () => {
      window.location.href = "sale.html";
    });

    document.getElementById("productsBtn").addEventListener("click", () => {
      alert("Products page coming soon!");
    });

    document.getElementById("historyBtn").addEventListener("click", () => {
      alert("Sales history page coming soon!");
    });

    document.getElementById("settingsBtn").addEventListener("click", () => {
      alert("Settings page coming soon!");
    });

    document.getElementById("logout").addEventListener("click", () => {
      window.location.href = "/";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f4f4f4;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
      width: 220px;
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #0056b3;
      transform: scale(1.03);
    }

    #logout {
      background-color: #ff3b30;
    }

    #logout:hover {
      background-color: #d32f2f;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: #111;
      color: white;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS</header>

  <main>
    <h2>👋 Welcome, Rony!</h2>
    <p>Select an option below:</p>

    <button class="btn" id="newSale">🧾 New Sale</button>
    <button class="btn" id="saleHistory">📜 Sale History</button>
    <button class="btn" id="settings">⚙️ Settings</button>
    <button class="btn" id="logout">🚪 Logout</button>
  </main>

  <footer>© 2025 Style Heaven</footer>

  <script>
    // redirect buttons
    document.getElementById("newSale").addEventListener("click", () => {
      window.location.href = "sale.html";
    });

    document.getElementById("saleHistory").addEventListener("click", () => {
      window.location.href = "history.html";
    });

    document.getElementById("settings").addEventListener("click", () => {
      window.location.href = "settings.html";
    });

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
    });

    // prevent unauthorized access
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
      text-align: center;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      font-weight: 600;
      font-size: 18px;
    }
    h2 {
      margin-top: 40px;
    }
    .btn {
      display: block;
      width: 200px;
      margin: 10px auto;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover {
      background: #0056b3;
    }
    .logout {
      background: #ff3b30;
    }
    .logout:hover {
      background: #d32f2f;
    }
    footer {
      margin-top: 40px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS</header>

  <main>
    <h2>🛍️ Welcome, Rony!</h2>
    <button class="btn" onclick="goTo('sale.html')">🧾 New Sale</button>
    <button class="btn" onclick="goTo('history.html')">📜 Sale History</button>
    <button class="btn" onclick="goTo('add-product.html')">➕ Add Product</button>
    <button class="btn" onclick="goTo('settings.html')">⚙️ Settings</button>
    <button class="btn logout" onclick="logout()">🚪 Logout</button>
  </main>

  <footer>© 2025 Style Heaven</footer>

  <script>
    function goTo(page) {
      window.location.href = page;
    }
    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS - Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #fafafa;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
    }
    main {
      flex: 1;
      padding: 20px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    .menu {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .menu button {
      width: 200px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    .menu button:hover {
      background-color: #0056b3;
    }
    .logout {
      background-color: #ff3b30;
    }
    .logout:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS</header>
  <main>
    <h2>🛍️ Welcome, Rony!</h2>
    <div class="menu">
      <button onclick="window.location.href='sale.html'">🛒 New Sale</button>
      <button onclick="window.location.href='history.html'">📜 Sale History</button>
      <button onclick="window.location.href='settings.html'">⚙️ Settings</button>
      <button class="logout" id="logoutBtn">🚪 Logout</button>
    </div>
  </main>

  <script>
    // যদি ইউজার লগইন না করে থাকে, তাহলে সরাসরি লগইন পেজে পাঠাবে
    if (!localStorage.getItem("loggedIn")) {
      window.location.href = "index.html";
    }

    // Logout বাটনের কাজ
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("loggedIn"); // লগইন ডেটা মুছে ফেলবে
      alert("👋 Logged out successfully!");
      window.location.href = "index.html"; // লগইন পেজে ফিরে যাবে
    });
  </script>
</body>
</html>

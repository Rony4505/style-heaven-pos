<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #f7f7f7;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 15px;
      padding: 20px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .btn {
      width: 80%;
      max-width: 300px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    #logout {
      background-color: #dc3545;
    }

    #logout:hover {
      background-color: #b02a37;
    }

    footer {
      text-align: center;
      padding: 10px;
      color: #666;
      font-size: 13px;
      background: #eee;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS</header>

  <main>
    <h2>Welcome, Rony 👋</h2>
    <button class="btn" id="newSale">🛒 New Sale</button>
    <button class="btn" id="products">📦 Products</button>
    <button class="btn" id="salesHistory">💰 Sales History</button>
    <button class="btn" id="settings">⚙️ Settings</button>
    <button class="btn" id="logout">🚪 Log Out</button>
  </main>

  <footer>© 2025 Style Heaven</footer>

  <script>
    // Navigation buttons (later you can link real pages)
    document.getElementById("newSale").addEventListener("click", () => {
      alert("🛒 New Sale page coming soon!");
    });

    document.getElementById("products").addEventListener("click", () => {
      alert("📦 Products page coming soon!");
    });

    document.getElementById("salesHistory").addEventListener("click", () => {
      alert("💰 Sales History page coming soon!");
    });

    document.getElementById("settings").addEventListener("click", () => {
      alert("⚙️ Settings page coming soon!");
    });

    // Log out button
    document.getElementById("logout").addEventListener("click", () => {
      if (confirm("Are you sure you want to log out?")) {
        window.location.href = "/"; // back to login page
      }
    });
  </script>
</body>
</html>

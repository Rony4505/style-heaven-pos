<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale | Style Heaven POS</title>
  <style>
    body { font-family: "Poppins", sans-serif; background: #f7f9fb; margin: 0; padding: 0; text-align: center; }
    header { background: #111; color: white; padding: 12px; font-weight: 600; }
    .container { margin: 20px auto; width: 95%; max-width: 900px; background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, select, button { padding: 8px; margin: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { background: #007bff; color: white; cursor: pointer; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #007bff; color: white; }
    .back-btn { background: red; position: absolute; top: 10px; right: 10px; }
    .summary { background: #f0f4ff; padding: 12px; margin-top: 10px; border-radius: 8px; }
    .confirm { background: #007bff; color: white; padding: 8px 20px; border-radius: 6px; border: none; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <header>Style Heaven POS - New Sale</header>
  <button class="back-btn" onclick="window.location.href='app.html'">🔙 Back</button>

  <div class="container">
    <h2>🧾 Create a New Sale</h2>
    <div>
      <input type="date" id="date" />
      <input type="text" id="customer" placeholder="Customer Name" />
      <input type="text" id="code" placeholder="Product Code" />
      <input type="text" id="name" placeholder="Product Name" readonly />
      <input type="number" id="price" placeholder="Selling Price (৳)" />
      <input type="number" id="qty" placeholder="Qty" min="1" value="1" />
      <span id="info" style="font-size:13px; color:#333;"></span>
      <button id="addBtn">Add</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Subtotal (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="saleTable"></tbody>
    </table>

    <h3>Total: ৳<span id="total">0</span></h3>

    <div class="summary">
      <label>Payment Method:</label>
      <select id="method">
        <option>Cash</option>
        <option>Bkash</option>
        <option>Nagad</option>
        <option>Card</option>
      </select>
      <br />
      <label>Paid (৳):</label>
      <input type="number" id="paid" placeholder="Enter Paid Amount" />
      <br />
      <h4>Change: ৳<span id="change">0</span></h4>
    </div>

    <button class="confirm" id="confirmBtn">✅ Confirm Sale</button>
  </div>

  <script>
    const dateInput = document.getElementById("date");
    const codeInput = document.getElementById("code");
    const nameInput = document.getElementById("name");
    const qtyInput = document.getElementById("qty");
    const priceInput = document.getElementById("price");
    const infoSpan = document.getElementById("info");
    const saleTable = document.getElementById("saleTable");
    const totalSpan = document.getElementById("total");
    const paidInput = document.getElementById("paid");
    const changeSpan = document.getElementById("change");

    dateInput.valueAsDate = new Date();

    let saleItems = [];
    let products = JSON.parse(localStorage.getItem("products") || "[]");
    let sales = JSON.parse(localStorage.getItem("sales") || "[]");

    // Product auto-fill
    codeInput.addEventListener("input", () => {
      const p = products.find(pr => pr.code === codeInput.value.trim());
      if (p) {
        nameInput.value = p.name;
        infoSpan.textContent = `Buying: ৳${p.buying} | Stock: ${p.qty}`;
      } else {
        nameInput.value = "";
        infoSpan.textContent = "❌ Stock not available";
      }
    });

    // Add product to sale table
    document.getElementById("addBtn").addEventListener("click", () => {
      const code = codeInput.value.trim();
      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);
      const qty = parseInt(qtyInput.value);
      const date = dateInput.value;
      const p = products.find(pr => pr.code === code);

      if (!p) return alert("❌ Product not found in stock!");
      if (qty > p.qty) return alert("⚠️ Not enough stock!");
      if (!price) return alert("⚠️ Please enter selling price!");

      const subtotal = price * qty;
      saleItems.push({ date, code, name, qty, price, subtotal });
      renderTable();

      codeInput.value = "";
      nameInput.value = "";
      qtyInput.value = 1;
      priceInput.value = "";
      infoSpan.textContent = "";
    });

    function renderTable() {
      saleTable.innerHTML = "";
      let total = 0;
      saleItems.forEach((item, i) => {
        total += item.subtotal;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>${item.price}</td>
          <td>${item.subtotal}</td>
          <td><button onclick="removeItem(${i})">❌</button></td>`;
        saleTable.appendChild(tr);
      });
      totalSpan.textContent = total;
    }

    window.removeItem = (i) => {
      saleItems.splice(i, 1);
      renderTable();
    };

    // ✅ Change calculation (Paid - Total)
    paidInput.addEventListener("input", () => {
      const total = parseFloat(totalSpan.textContent) || 0;
      const paid = parseFloat(paidInput.value) || 0;
      const change = paid - total;
      changeSpan.textContent = change >= 0 ? change : 0;
    });

    // ✅ Confirm Sale
    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (saleItems.length === 0) return alert("⚠️ No product added!");
      const total = parseFloat(totalSpan.textContent);
      const paid = parseFloat(paidInput.value) || 0;
      const change = paid - total;
      const method = document.getElementById("method").value;

      // Update stock after confirm
      saleItems.forEach(sale => {
        const p = products.find(pr => pr.code === sale.code);
        if (p) p.qty -= sale.qty;
      });
      localStorage.setItem("products", JSON.stringify(products));

      // Generate Invoice
      let inv = 1000 + (sales.length + 1);

      // Save to sales
      const saleData = {
        invoice: inv,
        date: new Date().toLocaleString(),
        items: saleItems,
        total,
        paid,
        change,
        method
      };

      sales.push(saleData);
      localStorage.setItem("sales", JSON.stringify(sales));

      alert(`✅ Sale Saved!\nInvoice: ${inv}\nTotal: ৳${total}\nPaid: ৳${paid}\nChange: ৳${change}`);

      saleItems = [];
      renderTable();
      totalSpan.textContent = 0;
      paidInput.value = "";
      changeSpan.textContent = 0;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale | Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background-color: #f5f7fa;
      padding: 10px;
    }

    header {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 18px;
      border-radius: 8px;
    }

    .container {
      margin-top: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .half {
      flex: 1;
      min-width: 130px;
    }

    .small-info {
      font-size: 12px;
      color: gray;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #007bff;
      margin: 10px 0;
      text-align: right;
    }

    .pay-methods {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 15px 0;
    }

    .pay-btn {
      flex: 1;
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .pay-btn.active {
      background: #007bff;
      color: white;
    }

    .confirm-btn {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .confirm-btn:hover {
      background: #218838;
    }

    .back-btn {
      background: #6c757d;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      width: 100%;
      margin-top: 10px;
      cursor: pointer;
    }

  </style>
</head>
<body>
  <header>🛍️ New Sale - Style Heaven</header>

  <div class="container">
    <div class="row">
      <div class="half">
        <label>Date</label>
        <input type="text" id="date" readonly />
      </div>
      <div class="half">
        <label>Invoice No</label>
        <input type="text" id="invoice" readonly />
      </div>
    </div>

    <div class="row">
      <div class="half">
        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter customer name" />
      </div>
      <div class="half">
        <label>Product Code</label>
        <input type="text" id="productCode" placeholder="Enter product code" />
      </div>
    </div>

    <div class="row">
      <div class="half">
        <label>Product Name</label>
        <input type="text" id="productName" readonly />
        <div id="buyingPrice" class="small-info"></div>
        <div id="stockInfo" class="small-info"></div>
      </div>
      <div class="half">
        <label>Selling Price</label>
        <input type="number" id="sellingPrice" placeholder="Enter selling price" />
      </div>
    </div>

    <div class="row">
      <div class="half">
        <label>Quantity</label>
        <input type="number" id="quantity" placeholder="Enter quantity" />
      </div>
      <div class="half total">
        <label>Total: </label> <span id="totalPrice">0</span> টাকা
      </div>
    </div>

    <div class="pay-methods">
      <button class="pay-btn" data-method="Cash">💵 Cash</button>
      <button class="pay-btn" data-method="Bkash">📱 Bkash</button>
      <button class="pay-btn" data-method="Nagad">🟠 Nagad</button>
      <button class="pay-btn" data-method="Rocket">🟣 Rocket</button>
      <button class="pay-btn" data-method="Bank">🏦 Bank</button>
    </div>

    <div class="row">
      <div class="half">
        <label>Paid</label>
        <input type="number" id="paid" placeholder="Enter paid amount" />
      </div>
      <div class="half">
        <label>Change</label>
        <input type="text" id="change" readonly />
      </div>
    </div>

    <button class="confirm-btn" id="confirmSale">✅ Confirm Sale</button>
    <button class="back-btn" onclick="window.location.href='app.html'">⬅️ Back</button>
  </div>

  <script>
    const dateEl = document.getElementById("date");
    const invoiceEl = document.getElementById("invoice");
    const codeEl = document.getElementById("productCode");
    const nameEl = document.getElementById("productName");
    const qtyEl = document.getElementById("quantity");
    const sellEl = document.getElementById("sellingPrice");
    const totalEl = document.getElementById("totalPrice");
    const paidEl = document.getElementById("paid");
    const changeEl = document.getElementById("change");
    const confirmBtn = document.getElementById("confirmSale");
    const buyInfo = document.getElementById("buyingPrice");
    const stockInfo = document.getElementById("stockInfo");
    const customerEl = document.getElementById("customerName");

    // Auto date and invoice
    const today = new Date();
    dateEl.value = today.toLocaleDateString();
    let inv = localStorage.getItem("invoice") ? parseInt(localStorage.getItem("invoice")) + 1 : 1001;
    invoiceEl.value = inv;

    // Select payment method
    let selectedPayment = "";
    document.querySelectorAll(".pay-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".pay-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedPayment = btn.dataset.method;
      });
    });

    // Auto-fill product by code
    codeEl.addEventListener("input", () => {
      const products = JSON.parse(localStorage.getItem("products") || "[]");
      const found = products.find(p => p.code === codeEl.value);
      if (found) {
        nameEl.value = found.name;
        buyInfo.textContent = "Buying Price: " + found.buyingPrice + " টাকা";
        stockInfo.textContent = "Stock Available: " + found.qty;
      } else {
        nameEl.value = "";
        buyInfo.textContent = "";
        stockInfo.textContent = "Stock not available!";
      }
    });

    // Calculate total
    function updateTotal() {
      const qty = parseFloat(qtyEl.value) || 0;
      const price = parseFloat(sellEl.value) || 0;
      totalEl.textContent = (qty * price).toFixed(2);
    }
    qtyEl.addEventListener("input", updateTotal);
    sellEl.addEventListener("input", updateTotal);

    // Change calculation
    paidEl.addEventListener("input", () => {
      const paid = parseFloat(paidEl.value) || 0;
      const total = parseFloat(totalEl.textContent) || 0;
      changeEl.value = (paid - total).toFixed(2);
    });

    // Confirm Sale
    confirmBtn.addEventListener("click", () => {
      const products = JSON.parse(localStorage.getItem("products") || "[]");
      const found = products.find(p => p.code === codeEl.value);
      if (!found) return alert("❌ Product not found in stock!");

      if (parseInt(qtyEl.value) > found.qty) {
        alert("❌ Not enough stock available!");
        return;
      }

      // Update stock
      found.qty -= parseInt(qtyEl.value);
      localStorage.setItem("products", JSON.stringify(products));

      // Save to sale history
      const sales = JSON.parse(localStorage.getItem("sales") || "[]");
      const sale = {
        date: dateEl.value,
        invoice: invoiceEl.value,
        customer: customerEl.value,
        code: codeEl.value,
        name: nameEl.value,
        qty: qtyEl.value,
        buyingPrice: (found.buyingPrice * qtyEl.value).toFixed(2),
        sellingPrice: (sellEl.value * qtyEl.value).toFixed(2),
        total: totalEl.textContent,
        change: changeEl.value,
        payment: selectedPayment
      };
      sales.push(sale);
      localStorage.setItem("sales", JSON.stringify(sales));
      localStorage.setItem("invoice", inv);

      alert("✅ Sale Confirmed!");
      window.location.reload();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #222;
      color: white;
    }
    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }
    .small-info {
      font-size: 12px;
      color: gray;
    }
    .pay-buttons button {
      background: #28a745;
      margin: 3px;
    }
    .pay-buttons button.active {
      background: #111;
    }
    .confirm-btn {
      background: #ff3b30;
      font-size: 18px;
      padding: 12px 25px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS - New Sale
    <button onclick="window.location.href='app.html'" style="float:right; background:red; border:none; color:white; padding:6px 10px; border-radius:6px; margin-right:10px;">Back</button>
  </header>

  <main>
    <div>
      <b>Date:</b> <span id="date"></span> &nbsp; | &nbsp;
      <b>Invoice No:</b> <span id="invoice"></span>
    </div>

    <br>

    <input type="text" id="productCode" placeholder="Product Code" oninput="fillProduct()">
    <input type="text" id="productName" placeholder="Product Name" readonly>
    <input type="number" id="price" placeholder="Selling Price (৳)">
    <input type="number" id="quantity" placeholder="Qty" min="1" value="1">
    <button onclick="addItem()">Add</button>

    <div class="small-info">
      <span id="buyingInfo"></span> | <span id="stockInfo"></span>
    </div>

    <table id="saleTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Total (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="total" id="total">Total: ৳0</div>

    <div class="pay-buttons">
      <button onclick="selectPayment('Cash')">💵 Cash</button>
      <button onclick="selectPayment('Bkash')">📱 Bkash</button>
      <button onclick="selectPayment('Nagad')">📲 Nagad</button>
      <button onclick="selectPayment('Rocket')">🚀 Rocket</button>
      <button onclick="selectPayment('Bank')">🏦 Bank</button>
    </div>

    <div>
      <input type="number" id="paid" placeholder="Paid (৳)" oninput="calcChange()">
      <input type="text" id="change" placeholder="Change (৳)" readonly>
    </div>

    <button class="confirm-btn" onclick="confirmSale()">✅ Confirm Sale</button>
  </main>

  <script>
    let items = [];
    let paymentMethod = "";
    let products = JSON.parse(localStorage.getItem("products") || "[]");

    // Date & Invoice setup
    document.getElementById("date").innerText = new Date().toLocaleDateString();
    let invoiceNo = parseInt(localStorage.getItem("lastInvoice") || "1000") + 1;
    document.getElementById("invoice").innerText = invoiceNo;

    function fillProduct() {
      const code = document.getElementById("productCode").value.trim();
      const product = products.find(p => p.code === code);
      if (product) {
        document.getElementById("productName").value = product.name;
        document.getElementById("buyingInfo").innerText = "Buying Price: ৳" + product.buying;
        document.getElementById("stockInfo").innerText = "Stock Available: " + product.qty;
      } else {
        document.getElementById("productName").value = "";
        document.getElementById("buyingInfo").innerText = "";
        document.getElementById("stockInfo").innerText = "❌ Stock not available";
      }
    }

    function addItem() {
      const name = document.getElementById("productName").value.trim();
      const code = document.getElementById("productCode").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const qty = parseInt(document.getElementById("quantity").value);
      const product = products.find(p => p.code === code);

      if (!product || !name || price <= 0 || qty <= 0) {
        alert("⚠️ Invalid product info!");
        return;
      }

      if (qty > product.qty) {
        alert("❌ Not enough stock!");
        return;
      }

      items.push({ code, name, price, qty, buying: product.buying });
      renderTable();
      document.getElementById("productCode").value = "";
      document.getElementById("productName").value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = 1;
      document.getElementById("buyingInfo").innerText = "";
      document.getElementById("stockInfo").innerText = "";
    }

    function renderTable() {
      const tbody = document.querySelector("#saleTable tbody");
      tbody.innerHTML = "";
      let total = 0;
      items.forEach((item, i) => {
        const sub = item.price * item.qty;
        total += sub;
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${sub}</td>
            <td><button onclick="removeItem(${i})">❌</button></td>
          </tr>`;
      });
      document.getElementById("total").innerText = "Total: ৳" + total;
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderTable();
    }

    function selectPayment(method) {
      paymentMethod = method;
      document.querySelectorAll(".pay-buttons button").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
    }

    function calcChange() {
      const total = items.reduce((a, b) => a + b.price * b.qty, 0);
      const paid = parseFloat(document.getElementById("paid").value) || 0;
      document.getElementById("change").value = paid - total;
    }

    function confirmSale() {
      if (items.length === 0) return alert("⚠️ No items added!");
      if (!paymentMethod) return alert("⚠️ Select payment method first!");

      const total = items.reduce((a, b) => a + b.price * b.qty, 0);
      const paid = parseFloat(document.getElementById("paid").value);
      const change = paid - total;
      const date = new Date().toLocaleString();

      let saleData = JSON.parse(localStorage.getItem("sales") || "[]");
      saleData.push({
        invoice: invoiceNo,
        date,
        items,
        total,
        paid,
        change,
        paymentMethod
      });
      localStorage.setItem("sales", JSON.stringify(saleData));
      localStorage.setItem("lastInvoice", invoiceNo);

      // Update stock only after confirm
      items.forEach(it => {
        const p = products.find(p => p.code === it.code);
        if (p) p.qty -= it.qty;
      });
      localStorage.setItem("products", JSON.stringify(products));

      alert("✅ Sale confirmed! Invoice #" + invoiceNo);
      items = [];
      renderTable();
      document.getElementById("paid").value = "";
      document.getElementById("change").value = "";
      invoiceNo++;
      document.getElementById("invoice").innerText = invoiceNo;
    }
  </script>
</body>
</html>

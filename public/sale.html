<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale | Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #111;
      color: white;
      padding: 12px;
      font-weight: 600;
    }
    .container {
      margin: 20px auto;
      width: 95%;
      max-width: 800px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    input, select, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background: #007bff;
      color: white;
    }
    .total-box {
      margin-top: 10px;
      font-weight: 600;
    }
    .payment-section {
      margin-top: 15px;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
    }
    .back-btn {
      background: red;
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .small-text {
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS - New Sale</header>
  <button class="back-btn" onclick="window.location.href='app.html'">🔙 Back</button>

  <div class="container">
    <h2>🧾 Create a New Sale</h2>
    <div class="form-row">
      <input type="date" id="date" />
      <input type="text" id="code" placeholder="Product Code" />
      <input type="text" id="productName" placeholder="Product Name" readonly />
      <input type="number" id="price" placeholder="Selling Price (৳)" />
      <input type="number" id="qty" placeholder="Qty" value="1" min="1" />
      <span id="buyStock" class="small-text"></span>
      <button id="addBtn">Add</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Subtotal (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="saleTable"></tbody>
    </table>

    <div class="total-box">Total: ৳<span id="total">0</span></div>

    <div class="payment-section">
      <label>Payment Method:</label>
      <select id="paymentMethod">
        <option value="Cash">Cash</option>
        <option value="bKash">bKash</option>
        <option value="Nagad">Nagad</option>
        <option value="Card">Card</option>
      </select>
      <br><br>
      <label>Paid (৳):</label>
      <input type="number" id="paid" placeholder="Enter Paid Amount" />
      <p>Change: ৳<span id="change">0</span></p>
    </div>

    <button id="confirmSale">✅ Confirm Sale</button>
  </div>

  <script>
    const dateInput = document.getElementById("date");
    const codeInput = document.getElementById("code");
    const nameInput = document.getElementById("productName");
    const priceInput = document.getElementById("price");
    const qtyInput = document.getElementById("qty");
    const buyStock = document.getElementById("buyStock");
    const tableBody = document.getElementById("saleTable");
    const totalEl = document.getElementById("total");
    const paidInput = document.getElementById("paid");
    const changeEl = document.getElementById("change");
    const confirmSaleBtn = document.getElementById("confirmSale");

    let products = JSON.parse(localStorage.getItem("products") || "[]");
    let saleItems = [];

    // Auto set today's date
    dateInput.valueAsDate = new Date();

    // Auto-fill product info by code
    codeInput.addEventListener("change", () => {
      const code = codeInput.value.trim();
      const found = products.find(p => p.code === code);
      if (found) {
        nameInput.value = found.name;
        buyStock.textContent = `Buying: ৳${found.buying} | Stock: ${found.qty}`;
      } else {
        nameInput.value = "";
        buyStock.textContent = "❌ Stock not available";
      }
    });

    // Add product to sale
    document.getElementById("addBtn").addEventListener("click", () => {
      const code = codeInput.value.trim();
      const qty = parseInt(qtyInput.value);
      const price = parseFloat(priceInput.value);
      const date = dateInput.value;
      const found = products.find(p => p.code === code);

      if (!found) return alert("❌ Product not available!");
      if (!price || price <= 0) return alert("❌ Please enter selling price!");
      if (qty > found.qty) return alert("❌ Not enough stock!");

      const subtotal = price * qty;
      saleItems.push({ date, name: found.name, qty, price, subtotal });
      found.qty -= qty;

      localStorage.setItem("products", JSON.stringify(products));
      renderTable();
      priceInput.value = "";
      qtyInput.value = 1;
      codeInput.value = "";
      nameInput.value = "";
      buyStock.textContent = "";
    });

    // Render table
    function renderTable() {
      tableBody.innerHTML = "";
      let total = 0;
      saleItems.forEach((item, i) => {
        total += item.subtotal;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.name}</td>
          <td>${item.qty}</td>
          <td>${item.price}</td>
          <td>${item.subtotal}</td>
          <td><button onclick="removeItem(${i})">❌</button></td>
        `;
        tableBody.appendChild(tr);
      });
      totalEl.textContent = total;
    }

    // Remove product
    window.removeItem = (i) => {
      saleItems.splice(i, 1);
      renderTable();
    };

    // Change calculation
    paidInput.addEventListener("input", () => {
      const paid = parseFloat(paidInput.value) || 0;
      const total = parseFloat(totalEl.textContent);
      changeEl.textContent = paid - total;
    });

    // Confirm Sale
    confirmSaleBtn.addEventListener("click", () => {
      if (saleItems.length === 0) return alert("No items added!");
      const invoice = "INV-" + Date.now();
      const total = totalEl.textContent;
      const paid = paidInput.value;
      const method = document.getElementById("paymentMethod").value;
      const change = changeEl.textContent;

      const sale = {
        invoice,
        date: new Date().toLocaleString(),
        items: saleItems,
        total,
        paid,
        method,
        change,
      };

      const history = JSON.parse(localStorage.getItem("sales") || "[]");
      history.push(sale);
      localStorage.setItem("sales", JSON.stringify(history));

      alert(`✅ Sale Saved!\nInvoice: ${invoice}\nTotal: ৳${total}\nPaid: ৳${paid}\nChange: ৳${change}`);
      saleItems = [];
      renderTable();
      paidInput.value = "";
      changeEl.textContent = "0";
    });
  </script>
</body>
</html>

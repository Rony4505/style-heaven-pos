<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style Heaven POS - Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      text-align: center;
      background: #f9f9f9;
    }
    main {
      margin-top: 80px;
    }
    .menu-btn {
      display: block;
      width: 200px;
      margin: 10px auto;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .menu-btn:hover {
      background: #0056b3;
    }
    .logout-btn {
      background: #dc3545;
    }
    .logout-btn:hover {
      background: #a71d2a;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS
  </header>

  <main>
    <h2>Welcome, Rony 👋</h2>
    <button class="menu-btn" onclick="goTo('sale.html')">🛍️ New Sale</button>
    <button class="menu-btn" onclick="goTo('products.html')">📦 Products</button>
    <button class="menu-btn" onclick="goTo('history.html')">💰 Sales History</button>
    <button class="menu-btn" onclick="goTo('settings.html')">⚙️ Settings</button>
    <button class="menu-btn logout-btn" onclick="logout()">🚪 Log Out</button>
  </main>

  <footer>
    <p>© 2025 Style Heaven</p>
  </footer>

  <script>
    function goTo(page) {
      window.location.href = page;
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      window.location.href = "index.html";
    }

    // যদি login না করা থাকে তাহলে redirect করো
    if (!localStorage.getItem("loggedIn")) {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

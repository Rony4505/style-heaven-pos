<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    main {
      text-align: center;
      margin-top: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #111;
      color: white;
    }
    #total {
      font-weight: bold;
      font-size: 18px;
    }
    .buying-price {
      color: #777;
      font-size: 13px;
    }
    .back-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .back-btn:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS - New Sale
    <button class="back-btn" onclick="window.location.href='app.html'" style="float:right; margin-right:10px;">⬅️ Back</button>
  </header>

  <main>
    <h2>🛍️ Create a New Sale</h2>
    <div>
      <input type="date" id="saleDate">
      <input type="text" id="productCode" placeholder="Product Code">
      <input type="text" id="productName" placeholder="Product Name" readonly>
      <input type="number" id="price" placeholder="Price (৳)">
      <input type="number" id="quantity" placeholder="Qty" value="1" min="1">
      <span id="buyInfo" class="buying-price"></span>
      <button onclick="addItem()">Add</button>
    </div>

    <table id="saleTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Subtotal (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="total">Total: ৳0</p>
    <button onclick="confirmSale()">✅ Confirm Sale</button>
  </main>

  <script>
    let items = [];
    const stock = JSON.parse(localStorage.getItem("productStock")) || [];

    // Set current date by default
    document.getElementById("saleDate").valueAsDate = new Date();

    const codeInput = document.getElementById("productCode");
    const nameInput = document.getElementById("productName");
    const priceInput = document.getElementById("price");
    const qtyInput = document.getElementById("quantity");
    const buyInfo = document.getElementById("buyInfo");

    // 🔹 Auto fill product info when code entered
    codeInput.addEventListener("change", function () {
      const code = this.value.trim();
      const found = stock.find(p => p.code === code);

      if (!found) {
        nameInput.value = "";
        buyInfo.innerText = "❌ Stock not available";
        return;
      }

      nameInput.value = found.name;
      buyInfo.innerText = `Buying Price: ৳${found.buyPrice} | Stock: ${found.qty}`;
    });

    function addItem() {
      const date = document.getElementById("saleDate").value;
      const code = codeInput.value.trim();
      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value);
      const price = parseFloat(priceInput.value);
      const product = stock.find(p => p.code === code);

      if (!product) return alert("❌ Product not found!");
      if (!date || !code || !name || isNaN(qty) || isNaN(price)) return alert("⚠️ Fill all fields!");
      if (qty > product.qty) return alert("❌ Not enough stock available!");

      const subtotal = qty * price;
      items.push({ date, code, name, qty, price, subtotal });

      renderTable();
      codeInput.value = "";
      nameInput.value = "";
      qtyInput.value = 1;
      priceInput.value = "";
      buyInfo.innerText = "";
    }

    function renderTable() {
      const tbody = document.querySelector("#saleTable tbody");
      tbody.innerHTML = "";
      let total = 0;

      items.forEach((item, i) => {
        total += item.subtotal;
        tbody.innerHTML += `
          <tr>
            <td>${item.date}</td>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${item.subtotal}</td>
            <td><button onclick="removeItem(${i})">❌</button></td>
          </tr>
        `;
      });

      document.getElementById("total").innerText = "Total: ৳" + total;
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderTable();
    }

    function confirmSale() {
      if (items.length === 0) return alert("No items added!");
      const total = items.reduce((a, b) => a + b.subtotal, 0);

      alert("✅ Sale confirmed! Total: ৳" + total);

      // Save to Sale History
      let sales = JSON.parse(localStorage.getItem("saleHistory")) || [];
      sales.push({ items, total, date: new Date().toLocaleString() });
      localStorage.setItem("saleHistory", JSON.stringify(sales));

      items = [];
      renderTable();
    }
  </script>
</body>
</html>

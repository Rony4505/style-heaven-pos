<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
    }
    main {
      text-align: center;
      padding: 20px;
    }
    input, select, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .back-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .back-btn:hover {
      background: #b02a37;
    }
    .small-text {
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>
  <header>
    🛒 New Sale
    <button class="back-btn" onclick="window.location.href='app.html'" style="float:right;margin-right:10px;">⬅️ Back</button>
  </header>

  <main>
    <h2>🧾 Create New Sale</h2>

    <div>
      <input type="text" id="productCode" placeholder="Product Code" />
      <input type="text" id="productName" placeholder="Product Name" readonly />
      <input type="number" id="stockQty" placeholder="Stock Qty" readonly />
      <input type="number" id="buyPrice" placeholder="Buying Price" readonly />
      <input type="number" id="sellPrice" placeholder="Selling Price" />
      <input type="number" id="saleQty" placeholder="Sale Qty" min="1" />
      <button onclick="addToSale()">Add</button>
    </div>

    <p id="stockStatus" class="small-text"></p>

    <table id="saleTable" style="width:95%;margin:auto;border-collapse:collapse;">
      <thead>
        <tr style="background:#111;color:white;">
          <th>Product</th>
          <th>Code</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h3>Total: <span id="totalAmount">৳0</span></h3>

    <div>
      <label>Payment Method:</label>
      <select id="paymentMethod">
        <option value="Cash">Cash</option>
        <option value="Bkash">Bkash</option>
        <option value="Nagad">Nagad</option>
      </select>
      <input type="number" id="paidAmount" placeholder="Paid Amount" />
    </div>

    <h3>Change: <span id="changeAmount">৳0</span></h3>

    <button onclick="confirmSale()">✅ Confirm Sale</button>
  </main>

  <script>
    let products = JSON.parse(localStorage.getItem("productStock")) || [];
    let saleItems = [];

    document.getElementById("productCode").addEventListener("input", function () {
      const code = this.value.trim();
      const product = products.find(p => p.code === code);

      const nameField = document.getElementById("productName");
      const stockField = document.getElementById("stockQty");
      const buyField = document.getElementById("buyPrice");
      const sellField = document.getElementById("sellPrice");
      const status = document.getElementById("stockStatus");

      if (product) {
        nameField.value = product.name;
        stockField.value = product.qty;
        buyField.value = product.buyPrice;
        sellField.value = product.sellPrice;
        status.textContent = "";
      } else {
        nameField.value = "";
        stockField.value = "";
        buyField.value = "";
        sellField.value = "";
        status.textContent = "⚠️ Stock not available!";
      }
    });

    function addToSale() {
      const code = document.getElementById("productCode").value.trim();
      const product = products.find(p => p.code === code);
      if (!product) return alert("❌ Product not found!");

      const qty = parseInt(document.getElementById("saleQty").value);
      const price = parseFloat(document.getElementById("sellPrice").value);
      if (!qty || !price) return alert("⚠️ Please enter valid quantity and price!");

      if (qty > product.qty) return alert("⚠️ Not enough stock!");

      const total = qty * price;
      saleItems.push({ name: product.name, code, qty, price, total });
      renderTable();
      calculateTotal();
    }

    function renderTable() {
      const tbody = document.querySelector("#saleTable tbody");
      tbody.innerHTML = "";
      saleItems.forEach((item, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.code}</td>
            <td>${item.qty}</td>
            <td>৳${item.price}</td>
            <td>৳${item.total}</td>
            <td><button onclick="removeItem(${i})">❌</button></td>
          </tr>`;
      });
    }

    function removeItem(i) {
      saleItems.splice(i, 1);
      renderTable();
      calculateTotal();
    }

    function calculateTotal() {
      const total = saleItems.reduce((sum, i) => sum + i.total, 0);
      document.getElementById("totalAmount").textContent = "৳" + total;
    }

    document.getElementById("paidAmount").addEventListener("input", () => {
      const total = saleItems.reduce((sum, i) => sum + i.total, 0);
      const paid = parseFloat(document.getElementById("paidAmount").value) || 0;
      const change = paid - total;
      document.getElementById("changeAmount").textContent = "৳" + change.toFixed(2);
    });

    function confirmSale() {
      if (saleItems.length === 0) return alert("⚠️ No items added!");

      const total = saleItems.reduce((sum, i) => sum + i.total, 0);
      const paid = parseFloat(document.getElementById("paidAmount").value) || 0;
      const change = paid - total;
      const payment = document.getElementById("paymentMethod").value;

      const invoice = {
        id: "INV" + Date.now(),
        date: new Date().toLocaleString(),
        items: saleItems,
        total,
        paid,
        change,
        payment
      };

      const history = JSON.parse(localStorage.getItem("saleHistory")) || [];
      history.push(invoice);
      localStorage.setItem("saleHistory", JSON.stringify(history));

      // Update product stock
      saleItems.forEach(sale => {
        const product = products.find(p => p.code === sale.code);
        if (product) product.qty -= sale.qty;
      });
      localStorage.setItem("productStock", JSON.stringify(products));

      alert("✅ Sale confirmed!");
      saleItems = [];
      renderTable();
      calculateTotal();
      document.getElementById("paidAmount").value = "";
      document.getElementById("changeAmount").textContent = "৳0";
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      font-weight: 600;
      font-size: 18px;
      position: relative;
    }
    header button {
      position: absolute;
      right: 15px;
      top: 10px;
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    main {
      padding: 15px;
    }
    input, select, button {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background: #111;
      color: white;
    }
    .total-section {
      text-align: right;
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }
    .pay-section {
      margin-top: 15px;
      text-align: center;
    }
    .pay-btn {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 3px;
      cursor: pointer;
    }
    .pay-btn:hover {
      background: #0056b3;
    }
    #confirm {
      background: green;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS - New Sale
    <button onclick="window.location.href='app.html'">Back</button>
  </header>

  <main>
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
      <div>Date: <span id="date"></span></div>
      <div>Invoice No: <span id="invoice"></span></div>
    </div>

    <div style="margin-top:10px;">
      <input type="text" id="customerName" placeholder="Customer Name">
      <input type="text" id="productCode" placeholder="Product Code">
      <input type="text" id="productName" placeholder="Product Name" readonly>
      <input type="number" id="price" placeholder="Selling Price (৳)">
      <input type="number" id="quantity" placeholder="Qty" min="1" value="1">
      <button onclick="addItem()">Add</button>
    </div>

    <small id="extraInfo" style="color:gray; display:block; margin-top:5px;"></small>

    <table id="saleTable">
      <thead>
        <tr>
          <th>Code</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Subtotal (৳)</th>
          <th>Buying (৳)</th>
          <th>Stock</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="total-section" id="total">Total: ৳0</div>

    <div class="pay-section">
      <h3>Select Payment Method</h3>
      <button class="pay-btn" onclick="setPayment('Cash')">Cash</button>
      <button class="pay-btn" onclick="setPayment('Bkash')">Bkash</button>
      <button class="pay-btn" onclick="setPayment('Nagad')">Nagad</button>
      <button class="pay-btn" onclick="setPayment('Rocket')">Rocket</button>
      <button class="pay-btn" onclick="setPayment('Bank')">Bank</button>
      <p>Selected: <strong id="paymentMethod">None</strong></p>

      <input type="number" id="paid" placeholder="Paid (৳)">
      <p>Change: <span id="change">৳0</span></p>
      <button id="confirm">✅ Confirm Sale</button>
    </div>
  </main>

  <script>
    const dateEl = document.getElementById("date");
    const invoiceEl = document.getElementById("invoice");
    const productCode = document.getElementById("productCode");
    const productName = document.getElementById("productName");
    const extraInfo = document.getElementById("extraInfo");

    // Auto date & invoice
    const today = new Date();
    dateEl.textContent = today.toLocaleDateString();
    const invoiceNo = localStorage.getItem("lastInvoice") ? parseInt(localStorage.getItem("lastInvoice")) + 1 : 1001;
    invoiceEl.textContent = invoiceNo;

    let items = [];
    let selectedPayment = null;

    // Load product info on code input
    productCode.addEventListener("change", () => {
      const products = JSON.parse(localStorage.getItem("products") || "[]");
      const p = products.find(pr => pr.code === productCode.value.trim());
      if (p) {
        productName.value = p.name;
        extraInfo.textContent = `Buying: ৳${p.buyingPrice}, Stock: ${p.stock}`;
      } else {
        productName.value = "";
        extraInfo.textContent = "⚠️ Stock not available!";
      }
    });

    function addItem() {
      const code = productCode.value.trim();
      const name = productName.value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const qty = parseInt(document.getElementById("quantity").value);

      const products = JSON.parse(localStorage.getItem("products") || "[]");
      const product = products.find(p => p.code === code);

      if (!code || !name || !price || !qty) return alert("Please fill all fields!");
      if (!product) return alert("Product not found in stock!");
      if (qty > product.stock) return alert("Not enough stock available!");

      items.push({ code, name, price, qty, buying: product.buyingPrice, stock: product.stock });
      renderTable();

      productCode.value = "";
      productName.value = "";
      document.getElementById("price").value = "";
      document.getElementById("quantity").value = 1;
      extraInfo.textContent = "";
    }

    function renderTable() {
      const tbody = document.querySelector("#saleTable tbody");
      tbody.innerHTML = "";
      let total = 0;
      items.forEach((item, i) => {
        const sub = item.price * item.qty;
        total += sub;
        tbody.innerHTML += `
          <tr>
            <td>${item.code}</td>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${sub}</td>
            <td style="color:gray;">${item.buying}</td>
            <td style="color:gray;">${item.stock}</td>
            <td><button onclick="removeItem(${i})">❌</button></td>
          </tr>
        `;
      });
      document.getElementById("total").innerText = "Total: ৳" + total.toFixed(2);
    }

    function removeItem(i) {
      items.splice(i, 1);
      renderTable();
    }

    function setPayment(method) {
      selectedPayment = method;
      document.getElementById("paymentMethod").textContent = method;
    }

    document.getElementById("paid").addEventListener("input", function() {
      const paid = parseFloat(this.value) || 0;
      const total = items.reduce((a, b) => a + b.price * b.qty, 0);
      const change = paid - total;
      document.getElementById("change").textContent = "৳" + change.toFixed(2);
    });

    document.getElementById("confirm").addEventListener("click", () => {
      if (items.length === 0) return alert("No items added!");
      if (!selectedPayment) return alert("Please select a payment method!");

      const total = items.reduce((a, b) => a + b.price * b.qty, 0);
      const paid = parseFloat(document.getElementById("paid").value) || 0;
      const change = paid - total;
      const customer = document.getElementById("customerName").value || "N/A";

      // Save to sales history
      const sales = JSON.parse(localStorage.getItem("sales") || "[]");
      sales.push({
        date: today.toLocaleDateString(),
        invoice: invoiceNo,
        customer,
        items,
        total: total.toFixed(2),
        change: change.toFixed(2),
      });
      localStorage.setItem("sales", JSON.stringify(sales));

      // Update stock (after confirm)
      const products = JSON.parse(localStorage.getItem("products") || "[]");
      items.forEach(sold => {
        const product = products.find(p => p.code === sold.code);
        if (product) product.stock -= sold.qty;
      });
      localStorage.setItem("products", JSON.stringify(products));

      // Save invoice number
      localStorage.setItem("lastInvoice", invoiceNo);

      alert("✅ Sale confirmed successfully!");
      items = [];
      renderTable();
      document.getElementById("paid").value = "";
      document.getElementById("change").textContent = "৳0";
    });
  </script>
</body>
</html>

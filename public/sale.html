<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale | Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f8f9fa;
      text-align: center;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
    }
    table {
      width: 95%;
      margin: 15px auto;
      border-collapse: collapse;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 14px;
    }
    .btn-add { background: #007bff; }
    .btn-confirm { background: #28a745; }
    .btn-back { background: #dc3545; margin: 10px; float: right; }
    input, select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 5px;
    }
    .summary {
      background: #fff;
      width: 95%;
      margin: 10px auto;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <header>Style Heaven POS - New Sale
    <button class="btn-back" onclick="goBack()">🔙 Back</button>
  </header>

  <h2>🧾 Create a New Sale</h2>

  <div>
    <input type="date" id="saleDate" />
    <input type="text" id="customer" placeholder="Customer Name" />
    <input type="text" id="productCode" placeholder="Product Code" />
    <input type="text" id="productName" placeholder="Product Name" readonly />
    <input type="number" id="sellingPrice" placeholder="Selling Price (৳)" />
    <input type="number" id="qty" placeholder="Qty" min="1" value="1" />
    <span id="buyInfo"></span>
    <button class="btn-add" onclick="addProduct()">Add</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Product</th>
        <th>Qty</th>
        <th>Price (৳)</th>
        <th>Subtotal (৳)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="cartBody"></tbody>
  </table>

  <div class="summary">
    <h3>Total: ৳<span id="total">0</span></h3>
    <div>
      Payment Method:
      <select id="paymentMethod">
        <option>Cash</option>
        <option>Bank</option>
        <option>Bkash</option>
        <option>Nagad</option>
      </select>
    </div>
    <div>
      Paid (৳): <input type="number" id="paidAmount" placeholder="Enter Paid Amount" />
    </div>
    <div>Change: ৳<span id="change">0</span></div>
    <button class="btn-confirm" id="confirmSale">✅ Confirm Sale</button>
  </div>

  <script>
    const cart = [];
    let invoiceNumber = 1001;

    document.getElementById("saleDate").valueAsDate = new Date();

    // Load products from localStorage
    const products = JSON.parse(localStorage.getItem("products") || "[]");

    document.getElementById("productCode").addEventListener("change", function() {
      const code = this.value.trim();
      const product = products.find(p => p.code === code);

      if (product) {
        document.getElementById("productName").value = product.name;
        document.getElementById("buyInfo").textContent = 
          `Buying: ৳${product.buyingPrice} | Stock: ${product.qty}`;
      } else {
        document.getElementById("productName").value = "";
        document.getElementById("buyInfo").textContent = "⚠️ Stock not available";
      }
    });

    function addProduct() {
      const code = document.getElementById("productCode").value.trim();
      const name = document.getElementById("productName").value.trim();
      const price = parseFloat(document.getElementById("sellingPrice").value);
      const qty = parseInt(document.getElementById("qty").value);
      const date = document.getElementById("saleDate").value;

      const product = products.find(p => p.code === code);

      if (!product || qty > product.qty) {
        alert("⚠️ Stock not available or insufficient!");
        return;
      }

      if (!name || !price || qty <= 0) {
        alert("⚠️ Please fill all fields properly!");
        return;
      }

      cart.push({ date, code, name, qty, price });
      updateCart();
    }

    function updateCart() {
      const cartBody = document.getElementById("cartBody");
      cartBody.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        const subtotal = item.qty * item.price;
        total += subtotal;

        const row = `
          <tr>
            <td>${item.date}</td>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${subtotal}</td>
            <td><button onclick="removeItem(${index})">❌</button></td>
          </tr>`;
        cartBody.innerHTML += row;
      });

      document.getElementById("total").textContent = total;
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    document.getElementById("paidAmount").addEventListener("input", function() {
      const total = parseFloat(document.getElementById("total").textContent);
      const paid = parseFloat(this.value) || 0;
      document.getElementById("change").textContent = paid - total;
    });

    document.getElementById("confirmSale").addEventListener("click", function() {
      if (cart.length === 0) return alert("❌ No products added!");

      const total = parseFloat(document.getElementById("total").textContent);
      const paid = parseFloat(document.getElementById("paidAmount").value) || 0;
      const change = paid - total;
      const method = document.getElementById("paymentMethod").value;
      const date = document.getElementById("saleDate").value;

      const saleData = {
        invoice: "INV-" + invoiceNumber++,
        date,
        total,
        paid,
        change,
        method,
        items: cart
      };

      // ✅ Save to sale history
      const sales = JSON.parse(localStorage.getItem("sales") || "[]");
      sales.push(saleData);
      localStorage.setItem("sales", JSON.stringify(sales));

      // ✅ Update stock
      saleData.items.forEach(saleItem => {
        const product = products.find(p => p.code === saleItem.code);
        if (product) {
          product.qty -= saleItem.qty;
        }
      });
      localStorage.setItem("products", JSON.stringify(products));

      alert(`✅ Sale Saved!\nInvoice: ${saleData.invoice}\nTotal: ৳${total}\nPaid: ৳${paid}\nChange: ৳${change}`);
      cart.length = 0;
      updateCart();
    });

    function goBack() {
      window.location.href = "app.html";
    }
  </script>
</body>
</html>

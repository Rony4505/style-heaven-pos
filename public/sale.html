<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Sale - Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f5f5;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
    }
    main {
      padding: 20px;
      text-align: center;
    }
    input, select, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #111;
      color: white;
    }
    #total {
      font-weight: bold;
      font-size: 18px;
      margin-top: 10px;
    }
    button.confirm {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    🛍️ New Sale - Style Heaven POS
    <button onclick="window.location.href='app.html'" style="float:right; background:red; border:none; color:white; padding:6px 10px; border-radius:6px;">Back</button>
  </header>

  <main>
    <h2>Create New Sale</h2>

    <div>
      <input type="text" id="productName" placeholder="Product Name" />
      <input type="number" id="price" placeholder="Price (৳)" />
      <input type="number" id="quantity" placeholder="Qty" value="1" min="1" />
      <button onclick="addItem()">Add</button>
    </div>

    <table id="saleTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price (৳)</th>
          <th>Subtotal (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <p id="total">Total: ৳0</p>

    <div>
      <select id="paymentMethod">
        <option value="Cash">Cash</option>
        <option value="Bkash">Bkash</option>
        <option value="Nagad">Nagad</option>
        <option value="Card">Card</option>
      </select>
      <input type="number" id="payAmount" placeholder="Pay Amount (৳)" />
    </div>

    <button class="confirm" onclick="confirmSale()">✅ Confirm Sale</button>
  </main>

  <script>
    let items = [];
    let invoiceNo = Date.now(); // unique invoice ID

    function addItem() {
      const name = document.getElementById('productName').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const qty = parseInt(document.getElementById('quantity').value);
      if (!name || price <= 0 || qty <= 0) return alert("Please enter valid info!");
      items.push({ name, price, qty });
      renderTable();
      document.getElementById('productName').value = '';
      document.getElementById('price').value = '';
      document.getElementById('quantity').value = 1;
    }

    function renderTable() {
      const tbody = document.querySelector('#saleTable tbody');
      tbody.innerHTML = '';
      let total = 0;
      items.forEach((item, i) => {
        const sub = item.price * item.qty;
        total += sub;
        tbody.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price}</td>
            <td>${sub}</td>
            <td><button onclick="removeItem(${i})">❌</button></td>
          </tr>`;
      });
      document.getElementById('total').innerText = "Total: ৳" + total;
    }

    function removeItem(index) {
      items.splice(index, 1);
      renderTable();
    }

    function confirmSale() {
      if (items.length === 0) return alert("No items added!");
      const total = items.reduce((a, b) => a + b.price * b.qty, 0);
      const payAmount = parseFloat(document.getElementById("payAmount").value) || 0;
      const due = total - payAmount;
      const paidBy = document.getElementById("paymentMethod").value;

      const saleRecord = {
        invoice: "INV-" + invoiceNo,
        date: new Date().toLocaleString(),
        items,
        total,
        paidBy,
        payAmount,
        due
      };

      let history = JSON.parse(localStorage.getItem("salesHistory")) || [];
      history.push(saleRecord);
      localStorage.setItem("salesHistory", JSON.stringify(history));

      alert(`✅ Sale Saved!\nInvoice: ${saleRecord.invoice}\nTotal: ৳${total}\nPaid: ৳${payAmount}\nDue: ৳${due}`);

      // reset
      items = [];
      renderTable();
      document.getElementById("payAmount").value = "";
      invoiceNo++;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sale History - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f8f8;
      margin: 0;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 14px;
      font-weight: 600;
      position: relative;
    }
    header button {
      position: absolute;
      left: 10px;
      top: 8px;
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
    button.clear {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px;
    }
  </style>
</head>
<body>
  <header>
    <button onclick="window.location.href='app.html'">← Back</button>
    📜 Sale History
  </header>

  <main style="padding:10px;">
    <table id="historyTable">
      <thead>
        <tr>
          <th>Invoice No</th>
          <th>Date & Time</th>
          <th>Product Details</th>
          <th>Total (৳)</th>
          <th>Paid By</th>
          <th>Pay (৳)</th>
          <th>Due (৳)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="clear" onclick="clearHistory()">🗑️ Clear All</button>
  </main>

  <script>
    const historyTable = document.querySelector("#historyTable tbody");
    const history = JSON.parse(localStorage.getItem("salesHistory")) || [];

    function renderHistory() {
      historyTable.innerHTML = "";
      if (history.length === 0) {
        historyTable.innerHTML = "<tr><td colspan='7'>No sales found</td></tr>";
        return;
      }
      history.forEach((sale) => {
        const products = sale.items.map(i => `${i.name} (${i.qty}x৳${i.price})`).join(", ");
        const row = `
          <tr>
            <td>${sale.invoice}</td>
            <td>${sale.date}</td>
            <td>${products}</td>
            <td>${sale.total}</td>
            <td>${sale.paidBy}</td>
            <td>${sale.payAmount}</td>
            <td>${sale.due}</td>
          </tr>`;
        historyTable.innerHTML += row;
      });
    }

    function clearHistory() {
      if (confirm("Clear all sale history?")) {
        localStorage.removeItem("salesHistory");
        renderHistory();
      }
    }

    renderHistory();
  </script>
</body>
</html>

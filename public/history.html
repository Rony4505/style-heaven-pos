<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sale History - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 20px;
      font-weight: 600;
      position: relative;
    }
    button {
      position: absolute;
      right: 15px;
      top: 10px;
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }
    table {
      width: 96%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background: #222;
      color: white;
    }
    tr:hover {
      background: #f1f1f1;
    }
  </style>
</head>
<body>
  <header>
    Style Heaven POS - Sale History
    <button onclick="window.location.href='app.html'">Back</button>
  </header>

  <main>
    <table id="historyTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Invoice No</th>
          <th>Customer Name</th>
          <th>Product Code</th>
          <th>Product Name</th>
          <th>Qty</th>
          <th>Total Buying Price (৳)</th>
          <th>Total Selling Price (৳)</th>
          <th>Total (৳)</th>
          <th>Change (৳)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    const sales = JSON.parse(localStorage.getItem("sales") || "[]");
    const products = JSON.parse(localStorage.getItem("products") || "[]");
    const tbody = document.querySelector("#historyTable tbody");

    if (sales.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10">No sale records found</td></tr>`;
    } else {
      sales.forEach(sale => {
        sale.items.forEach(item => {
          const product = products.find(p => p.code === item.code);
          const buyingPrice = product ? parseFloat(product.buyingPrice) || 0 : 0;
          const totalBuying = buyingPrice * item.qty; // ✅ Selling Qty × Buying Price
          const totalSelling = item.price * item.qty;

          const row = `
            <tr>
              <td>${sale.date}</td>
              <td>${sale.invoice}</td>
              <td>${sale.customer || "-"}</td>
              <td>${item.code}</td>
              <td>${item.name}</td>
              <td>${item.qty}</td>
              <td>${totalBuying.toFixed(2)}</td>
              <td>${totalSelling.toFixed(2)}</td>
              <td>${sale.total}</td>
              <td>${sale.change}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      });
    }
  </script>
</body>
</html>

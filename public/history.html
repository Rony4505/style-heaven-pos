<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sale History - Style Heaven POS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8f9fa;
      margin: 0;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 18px;
      position: relative;
    }
    header button {
      position: absolute;
      right: 10px;
      top: 10px;
      background: red;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    main {
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #111;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    Sale History
    <button onclick="window.location.href='app.html'">Back</button>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Invoice No</th>
          <th>Date & Time</th>
          <th>Product Name</th>
          <th>Product Qty</th>
          <th>Total (৳)</th>
          <th>Paid By</th>
          <th>Pay Taka (৳)</th>
          <th>Change (৳)</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <tr>
          <td>INV001</td>
          <td>2025-11-04 12:30 PM</td>
          <td>T-shirt</td>
          <td>2</td>
          <td>800</td>
          <td>Cash</td>
          <td>1000</td>
          <td>200</td>
        </tr>
        <tr>
          <td>INV002</td>
          <td>2025-11-04 01:10 PM</td>
          <td>Jeans</td>
          <td>1</td>
          <td>1200</td>
          <td>Card</td>
          <td>1200</td>
          <td>0</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>

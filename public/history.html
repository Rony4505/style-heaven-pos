<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sale History - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background: #f9f9f9;
    }
    header {
      background: #111;
      color: white;
      padding: 14px;
      text-align: center;
      font-weight: 600;
    }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #111;
      color: white;
    }
    button {
      margin: 10px;
      padding: 8px 16px;
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS - Sale History</header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Product</th>
          <th>Qty</th>
          <th>Total (৳)</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>03/11/2025</td><td>T-shirt</td><td>2</td><td>800</td></tr>
        <tr><td>04/11/2025</td><td>Jeans</td><td>1</td><td>1200</td></tr>
      </tbody>
    </table>

    <button onclick="window.location.href='app.html'">⬅️ Back</button>
  </main>
</body>
</html>

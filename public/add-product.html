<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background-color: #f5f7fa;
      padding: 10px;
    }

    header {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 18px;
      border-radius: 8px;
    }

    .container {
      margin-top: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: #0056b3;
    }

    .back-btn {
      background: #6c757d;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>➕ Add Product - Style Heaven</header>

  <div class="container">
    <label>Product Code</label>
    <input type="text" id="code" placeholder="Enter product code" />

    <label>Product Name</label>
    <input type="text" id="name" placeholder="Enter product name" />

    <label>Buying Price (in টাকা)</label>
    <input type="number" id="buyingPrice" placeholder="Enter buying price" />

    <label>Quantity</label>
    <input type="number" id="quantity" placeholder="Enter quantity" />

    <button id="addBtn">✅ Add Product</button>
    <button class="back-btn" onclick="window.location.href='app.html'">⬅️ Back</button>
  </div>

  <script>
    const codeEl = document.getElementById("code");
    const nameEl = document.getElementById("name");
    const buyingEl = document.getElementById("buyingPrice");
    const qtyEl = document.getElementById("quantity");
    const addBtn = document.getElementById("addBtn");

    addBtn.addEventListener("click", () => {
      const code = codeEl.value.trim();
      const name = nameEl.value.trim();
      const buyingPrice = parseFloat(buyingEl.value);
      const qty = parseInt(qtyEl.value);

      if (!code || !name || !buyingPrice || !qty) {
        alert("⚠️ Please fill all fields properly!");
        return;
      }

      const products = JSON.parse(localStorage.getItem("products") || "[]");

      // Check if product code already exists
      const exists = products.find(p => p.code === code);
      if (exists) {
        alert("⚠️ Product with this code already exists!");
        return;
      }

      // ✅ Store product with consistent key names
      const product = {
        code: code,
        name: name,
        buyingPrice: buyingPrice,  // <-- same key used in New Sale
        qty: qty
      };

      products.push(product);
      localStorage.setItem("products", JSON.stringify(products));

      alert("✅ Product added successfully!");
      codeEl.value = "";
      nameEl.value = "";
      buyingEl.value = "";
      qtyEl.value = "";
    });
  </script>
</body>
</html>

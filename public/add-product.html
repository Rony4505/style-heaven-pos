<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product - Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }
    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
    }
    main {
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #111;
      color: white;
    }
    .back-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
    }
    .back-btn:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>
  <header>
    Add Product
    <button class="back-btn" onclick="window.location.href='app.html'" style="float:right; margin-right:10px;">⬅️ Back</button>
  </header>

  <main>
    <h2>📦 Add New Product</h2>

    <div>
      <input type="date" id="stockDate">
      <input type="text" id="productName" placeholder="Product Name">
      <input type="text" id="productCode" placeholder="Product Code">
      <input type="number" id="productQty" placeholder="Product Qty" min="1">
      <input type="number" id="buyPrice" placeholder="Buying Price (৳)">
      <input type="number" id="sellPrice" placeholder="Selling Price (৳)">
      <button onclick="addProduct()">Add</button>
    </div>

    <table id="productTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Product Name</th>
          <th>Code</th>
          <th>Qty</th>
          <th>Buying Price</th>
          <th>Selling Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    let products = JSON.parse(localStorage.getItem("productStock")) || [];

    document.getElementById("stockDate").valueAsDate = new Date();
    renderTable();

    function addProduct() {
      const date = document.getElementById("stockDate").value;
      const name = document.getElementById("productName").value.trim();
      const code = document.getElementById("productCode").value.trim();
      const qty = parseInt(document.getElementById("productQty").value);
      const buyPrice = parseFloat(document.getElementById("buyPrice").value);
      const sellPrice = parseFloat(document.getElementById("sellPrice").value);

      if (!date || !name || !code || isNaN(qty) || isNaN(buyPrice) || isNaN(sellPrice)) {
        return alert("⚠️ Please fill all fields correctly!");
      }

      const existing = products.find(p => p.code === code);
      if (existing) {
        existing.qty += qty;
        existing.buyPrice = buyPrice;
        existing.sellPrice = sellPrice;
      } else {
        products.push({ date, name, code, qty, buyPrice, sellPrice });
      }

      localStorage.setItem("productStock", JSON.stringify(products));
      renderTable();

      document.getElementById("productName").value = "";
      document.getElementById("productCode").value = "";
      document.getElementById("productQty").value = "";
      document.getElementById("buyPrice").value = "";
      document.getElementById("sellPrice").value = "";
    }

    function renderTable() {
      const tbody = document.querySelector("#productTable tbody");
      tbody.innerHTML = "";
      products.forEach((p, i) => {
        tbody.innerHTML += `
          <tr>
            <td>${p.date}</td>
            <td>${p.name}</td>
            <td>${p.code}</td>
            <td>${p.qty}</td>
            <td>৳${p.buyPrice}</td>
            <td>৳${p.sellPrice}</td>
            <td><button onclick="deleteProduct(${i})">❌</button></td>
          </tr>
        `;
      });
    }

    function deleteProduct(i) {
      if (confirm("🗑️ Delete this product?")) {
        products.splice(i, 1);
        localStorage.setItem("productStock", JSON.stringify(products));
        renderTable();
      }
    }
  </script>
</body>
</html>

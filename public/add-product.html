<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | Style Heaven POS</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #111;
      color: white;
      padding: 14px;
      width: 100%;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    main {
      flex: 1;
      width: 90%;
      max-width: 400px;
      background-color: white;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
    }
    label {
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 14px;
    }
    button {
      width: 100%;
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .back-btn {
      background-color: #555;
      margin-top: 15px;
    }
    .back-btn:hover {
      background-color: #333;
    }
    footer {
      text-align: center;
      padding: 10px;
      color: #666;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>➕ Add Product</header>

  <main>
    <h2>🧾 New Product Entry</h2>
    <label for="stockDate">Stock Date</label>
    <input type="date" id="stockDate" />

    <label for="productName">Product Name</label>
    <input type="text" id="productName" placeholder="e.g. Denim Shirt" />

    <label for="productCode">Product Code</label>
    <input type="text" id="productCode" placeholder="e.g. SH123" />

    <label for="productQty">Product Qty</label>
    <input type="number" id="productQty" placeholder="e.g. 10" />

    <label for="buyPrice">Buying Price (৳)</label>
    <input type="number" id="buyPrice" placeholder="e.g. 450" />

    <label for="sellPrice">Selling Price (৳)</label>
    <input type="number" id="sellPrice" placeholder="e.g. 650" />

    <button id="saveProduct">💾 Save Product</button>
    <button class="back-btn" onclick="window.location.href='app.html'">⬅️ Back</button>
  </main>

  <footer>Style Heaven POS © 2025</footer>

  <script>
    document.getElementById("saveProduct").addEventListener("click", () => {
      const stockDate = document.getElementById("stockDate").value;
      const name = document.getElementById("productName").value.trim();
      const code = document.getElementById("productCode").value.trim();
      const qty = document.getElementById("productQty").value.trim();
      const buy = document.getElementById("buyPrice").value.trim();
      const sell = document.getElementById("sellPrice").value.trim();

      if (!stockDate || !name || !code || !qty || !buy || !sell) {
        alert("⚠️ সব তথ্য পূরণ করুন!");
        return;
      }

      const product = { stockDate, name, code, qty, buy, sell };
      let allProducts = JSON.parse(localStorage.getItem("products") || "[]");
      allProducts.push(product);
      localStorage.setItem("products", JSON.stringify(allProducts));

      alert("✅ Product Saved Successfully!");
      document.querySelectorAll("input").forEach(input => input.value = "");
    });
  </script>
</body>
</html>

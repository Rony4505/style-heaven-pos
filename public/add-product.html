<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f7f9fb;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #111;
      color: white;
      padding: 12px;
      font-weight: 600;
    }
    .container {
      margin: 20px auto;
      width: 95%;
      max-width: 700px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    input, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }
    th {
      background: #007bff;
      color: white;
    }
    .back-btn {
      background: red;
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .total-buying {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>
<body>
  <header>Style Heaven POS - Add Product</header>
  <button class="back-btn" onclick="window.location.href='app.html'">🔙 Back</button>

  <div class="container">
    <h2>➕ Add New Product</h2>

    <div class="form-row">
      <input type="text" id="code" placeholder="Product Code" />
      <input type="text" id="name" placeholder="Product Name" />
      <input type="number" id="buying" placeholder="Buying Price (৳)" />
      <input type="number" id="qty" placeholder="Qty" min="1" value="1" />
      <span id="totalBuying" class="total-buying">Total: ৳0</span>
      <button id="addBtn">Add</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Product</th>
          <th>Buying (৳)</th>
          <th>Qty</th>
          <th>Total Buying (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="productTable"></tbody>
    </table>
  </div>

  <script>
    const codeInput = document.getElementById("code");
    const nameInput = document.getElementById("name");
    const buyingInput = document.getElementById("buying");
    const qtyInput = document.getElementById("qty");
    const totalBuying = document.getElementById("totalBuying");
    const tableBody = document.getElementById("productTable");

    let products = JSON.parse(localStorage.getItem("products") || "[]");

    // Auto calculate total buying
    function updateTotal() {
      const b = parseFloat(buyingInput.value) || 0;
      const q = parseInt(qtyInput.value) || 0;
      totalBuying.textContent = "Total: ৳" + (b * q);
    }

    buyingInput.addEventListener("input", updateTotal);
    qtyInput.addEventListener("input", updateTotal);

    // Add Product
    document.getElementById("addBtn").addEventListener("click", () => {
      const code = codeInput.value.trim();
      const name = nameInput.value.trim();
      const buying = parseFloat(buyingInput.value);
      const qty = parseInt(qtyInput.value);

      if (!code || !name || !buying || !qty) return alert("⚠️ Please fill all fields!");
      if (products.some(p => p.code === code)) return alert("⚠️ This product code already exists!");

      products.push({ code, name, buying, qty });
      localStorage.setItem("products", JSON.stringify(products));

      renderTable();
      codeInput.value = "";
      nameInput.value = "";
      buyingInput.value = "";
      qtyInput.value = 1;
      updateTotal();
    });

    function renderTable() {
      tableBody.innerHTML = "";
      products.forEach((p, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.code}</td>
          <td>${p.name}</td>
          <td>${p.buying}</td>
          <td>${p.qty}</td>
          <td>${p.buying * p.qty}</td>
          <td><button onclick="deleteProduct(${i})">❌</button></td>
        `;
        tableBody.appendChild(tr);
      });
    }

    window.deleteProduct = (i) => {
      if (confirm("Delete this product?")) {
        products.splice(i, 1);
        localStorage.setItem("products", JSON.stringify(products));
        renderTable();
      }
    };

    renderTable();
  </script>
</body>
</html>

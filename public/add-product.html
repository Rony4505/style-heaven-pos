<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | Style Heaven POS</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background-color: #f5f7fa;
      padding: 10px;
    }

    header {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-weight: 600;
      font-size: 18px;
      border-radius: 8px;
    }

    .container {
      margin-top: 15px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    label {
      font-size: 14px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      margin-top: 4px;
    }

    button {
      width: 100%;
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .back-btn {
      background: #6c757d;
      margin-top: 10px;
    }

  </style>
</head>
<body>
  <header>➕ Add New Product - Style Heaven</header>

  <div class="container">
    <label>Product Code</label>
    <input type="text" id="code" placeholder="Enter product code" />

    <label>Product Name</label>
    <input type="text" id="name" placeholder="Enter product name" />

    <label>Buying Price (টাকা)</label>
    <input type="number" id="buyingPrice" placeholder="Enter buying price" />

    <label>Selling Price (টাকা)</label>
    <input type="number" id="sellingPrice" placeholder="Enter selling price" />

    <label>Quantity</label>
    <input type="number" id="qty" placeholder="Enter quantity" />

    <button id="saveBtn">💾 Save Product</button>
    <button class="back-btn" onclick="window.location.href='app.html'">⬅️ Back</button>
  </div>

  <script>
    const codeEl = document.getElementById("code");
    const nameEl = document.getElementById("name");
    const buyEl = document.getElementById("buyingPrice");
    const sellEl = document.getElementById("sellingPrice");
    const qtyEl = document.getElementById("qty");
    const saveBtn = document.getElementById("saveBtn");

    saveBtn.addEventListener("click", () => {
      const code = codeEl.value.trim();
      const name = nameEl.value.trim();
      const buyingPrice = parseFloat(buyEl.value) || 0;
      const sellingPrice = parseFloat(sellEl.value) || 0;
      const qty = parseInt(qtyEl.value) || 0;

      if (!code || !name || buyingPrice <= 0 || sellingPrice <= 0 || qty <= 0) {
        alert("⚠️ Please fill all fields correctly!");
        return;
      }

      const products = JSON.parse(localStorage.getItem("products") || "[]");
      const exists = products.find(p => p.code === code);

      if (exists) {
        if (confirm("Product already exists. Update existing product?")) {
          exists.name = name;
          exists.buyingPrice = buyingPrice;
          exists.sellingPrice = sellingPrice;
          exists.qty += qty;
        }
      } else {
        products.push({ code, name, buyingPrice, sellingPrice, qty });
      }

      localStorage.setItem("products", JSON.stringify(products));
      alert("✅ Product saved successfully!");
      
      // Clear inputs
      codeEl.value = "";
      nameEl.value = "";
      buyEl.value = "";
      sellEl.value = "";
      qtyEl.value = "";
    });
  </script>
</body>
</html>
